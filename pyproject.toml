[project]
name = "netease-to-youtube-or-spotify"
version = "0.1.0"
description = "Local playlist name and artist exporter for NetEase and QQ Music"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["Flask>=3.1,<4"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = false
